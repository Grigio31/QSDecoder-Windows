name: Build Windows VST3 - 2024 Core Test

on:
  push:
    branches: [ test/2024-core ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64
      - name: Build
        run: cmake --build build --config Release --target QSDecoder2024Core_VST3
      - name: Locate VST3
        shell: pwsh
        run: Get-ChildItem -Path build -Recurse -Filter "QSDecoder-2024Core.vst3" | Select-Object FullName
      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: QSDecoder-2024Core-Windows-x64-VST3
          path: build/QSDecoder2024Core_artefacts/Release/VST3/QSDecoder-2024Core.vst3
          if-no-files-found: error
