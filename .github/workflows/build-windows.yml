name: Build Windows VST3

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64
      - name: Build
        run: cmake --build build --config Release --target QSDecoder_VST3
      - name: Locate VST3
        shell: pwsh
        run: Get-ChildItem -Path build -Recurse -Filter "QSDecoder.vst3" | Select-Object FullName
      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: QSDecoder-Windows-x64-VST3
          path: build/QSDecoder_artefacts/Release/VST3/QSDecoder.vst3
          if-no-files-found: error
